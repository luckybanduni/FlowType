<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlowType — Level 1</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <!-- Top Bar -->
        <header class="top-bar">

            <div class="logo">
                <span>⌨</span>
                FlowType
            </div>

            <div class="level">
                Level 1
            </div>

            <div class="score">
                <span>Typed</span>
                <strong id="score">0</strong>
            </div>

        </header>


        <!-- Game Area -->
        <main id="gameArea">

            <div class="welcome" id="welcome">

                <div class="welcome-icon">⌨</div>

                <h1>Just type.</h1>

                <p>
                    Letters and words will appear around you.
                    <br>
                    Type them at your own pace.
                </p>

                <button id="startButton">
                    Start typing
                </button>

            </div>

        </main>


        <!-- Bottom message -->
        <footer>
            No timer · No lives · No pressure
        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
