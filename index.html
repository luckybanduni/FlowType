<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlowType — Type Freely</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

    <!-- ================= TOP BAR ================= -->
    <header class="top-bar">

        <div class="logo">
            <span>⌨</span>
            FlowType
        </div>

        <div class="stats">

            <div class="stat">
                <span>Level</span>
                <strong id="level">1</strong>
            </div>

            <div class="stat">
                <span>WPM</span>
                <strong id="wpm">0</strong>
            </div>

            <div class="stat">
                <span>ACC</span>
                <strong id="accuracy">100%</strong>
            </div>

            <div class="stat">
                <span>Combo</span>
                <strong id="combo">0</strong>
            </div>

            <div class="stat">
                <span>Typed</span>
                <strong id="score">0</strong>
            </div>

        </div>

        <!-- MUSIC TOGGLE -->
        <button id="musicToggle" class="icon-button" title="Music">
            🎵
        </button>

    </header>


    <!-- ================= GAME AREA ================= -->

    <main id="gameArea">

        <!-- WELCOME SCREEN -->

        <div class="welcome" id="welcome">

            <div class="welcome-icon">⌨</div>

            <h1>Just type.</h1>

            <p>
                Practice makes a man Perfect
                <br>
                
            </p>


            <!-- SPEED -->

            <div class="speed-section">

                <p class="speed-title">
                    Choose your speed
                </p>

                <div class="speed-options">

                    <button
                        class="speed-option active"
                        data-speed="slow">
                        🐢
                        <span>Relaxed</span>
                    </button>

                    <button
                        class="speed-option"
                        data-speed="easy">
                        🚶
                        <span>Easy</span>
                    </button>

                    <button
                        class="speed-option"
                        data-speed="normal">
                        🏃
                        <span>Normal</span>
                    </button>

                    <button
                        class="speed-option"
                        data-speed="fast">
                        ⚡
                        <span>Fast</span>
                    </button>

                    <button
                        class="speed-option"
                        data-speed="very-fast">
                        🔥
                        <span>Very Fast</span>
                    </button>

                </div>

            </div>


            <button
                id="startButton"
                class="start-button">
                Start Typing
            </button>

        </div>


        <!-- GAME CONTROLS -->

        <div class="game-controls" id="gameControls">

            <button id="pauseButton">
                ⏸ Pause
            </button>

            <button id="restartButton">
                ↻ Restart
            </button>

        </div>


        <!-- PAUSE -->

        <div class="pause-screen" id="pauseScreen">

            <div class="pause-box">

                <div class="pause-icon">Ⅱ</div>

                <h2>Paused</h2>

                <p>
                    Take your time.
                </p>

                <button id="resumeButton">
                    Continue
                </button>

            </div>

        </div>


        <!-- RESULTS -->

        <div class="results-screen" id="resultsScreen">

            <div class="results-box">

                <h2>Nice flow.</h2>

                <div class="result-row">
                    <span>Typed</span>
                    <strong id="finalScore">0</strong>
                </div>

                <div class="result-row">
                    <span>WPM</span>
                    <strong id="finalWpm">0</strong>
                </div>

                <div class="result-row">
                    <span>Accuracy</span>
                    <strong id="finalAccuracy">100%</strong>
                </div>

                <button id="playAgainButton">
                    Play again
                </button>

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <span>
           Made By Lucky_Banduni 😁
        </span>

        <span class="footer-divider">
            •
        </span>

        <a
            href="https://instagram.com/Lucky_Banduni"
            target="_blank"
            rel="noopener noreferrer">

            Instagram

        </a>

    </footer>

</div>


<script src="script.js"></script>

</body>
</html>
